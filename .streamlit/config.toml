# The app's own dark look (ui.CSS) on every machine: without this, Streamlit follows the
# system's light/dark setting and tables and widgets turn light on a light-mode laptop.
[theme]
base = "dark"
primaryColor = "#5e72eb"
backgroundColor = "#070b16"
secondaryBackgroundColor = "#111a2f"
textColor = "#e8ebf4"

[client]
toolbarMode = "viewer"          # no Deploy button or developer menu in the presentation

[browser]
gatherUsageStats = false
