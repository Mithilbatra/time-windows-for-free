# The app's own dark look (ui.CSS) on every machine: without this, Streamlit follows the
# system's light/dark setting and tables and widgets turn light on a light-mode laptop.
[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b0e1a"
secondaryBackgroundColor = "#0f1629"
textColor = "#e2e8f0"

[browser]
gatherUsageStats = false
